<style>
:root{
  --ivory:#F9F7F4;--paper:#FFFFFF;--panel:#F4F1EC;--ink:#1A1917;--ink2:#3A3733;--muted:#6B6560;
  --line:#E5E0D8;--line2:#CFC9C0;--cardinal:#8C1515;--cardinal2:#A81A1A;--gold:#B8962E;--gold-d:#8A6E1E;--gold-bg:#FBF3DC;
  --good:#2E7D32;--good-bg:#E8F5E9;--warn:#B26A00;--warn-bg:#FFF4E5;--bad:#C62828;--bad-bg:#FFEBEE;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--cardinal)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
@media(max-width:480px){.wrap{padding:0 14px}}
.mast{background:var(--paper);border-bottom:2px solid var(--gold)}
.mast .wrap{padding-top:16px}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.home{display:inline-flex;text-decoration:none;color:var(--cardinal);font-size:13px;font-weight:600;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;background:var(--paper)}
html.framed .home{display:none}
.spacer{flex:1}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-d);font-weight:700;margin-top:12px}
h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;margin:4px 0 6px}
h1 em{color:var(--cardinal);font-style:italic}
.lede{color:var(--muted);font-size:15px;max-width:820px}
.tabs{display:flex;flex-wrap:wrap;gap:0 2px;margin-top:14px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--cardinal);border-bottom-color:var(--cardinal)}
.tab:hover{color:var(--ink)}
main{padding:22px 0 64px}
.hidden{display:none!important}
.btn{border:1px solid var(--line2);background:var(--paper);border-radius:4px;padding:7px 13px;font-weight:600;cursor:pointer;min-height:36px;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--cardinal);border-color:var(--cardinal);color:#fff}
.btn.primary:hover{background:var(--cardinal2)}
h2{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2;margin:6px 0 4px}
h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);font-size:13.5px;max-width:820px;margin-bottom:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px;min-width:0}
.card>.sub{margin-bottom:10px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.grid2>.card{margin-bottom:0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:13px 15px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi .s s{text-decoration-color:var(--cardinal)}
.iter{display:grid;grid-template-columns:54px 1fr;gap:0 14px;margin-bottom:18px}
.iter-n{font-family:var(--serif);font-size:30px;color:var(--gold);font-weight:600;line-height:1}
.iter-n small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-top:4px}
.feat{display:grid;grid-template-columns:minmax(180px,250px) 1fr;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line)}
.feat:last-child{border-bottom:none}
.feat .nm{font-weight:700}
.feat .nm .chip{margin-left:6px}
.feat .rs{font-size:13.5px;color:var(--ink2)}
.feat .fl{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-word}
@media(max-width:640px){.feat{grid-template-columns:1fr}.iter{grid-template-columns:1fr}.iter-n{margin-bottom:6px}}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--gold-bg);color:var(--gold-d);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.fit{background:#E4E9FF;color:#2238A8} .chip.fabric{background:#FFF1C7;color:#7A5600} .chip.durability{background:#FBE2D6;color:#8C3410}
.ctl{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.ctl label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:3px}
select,input[type=number],input[type=text]{background:var(--paper);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;min-height:36px;max-width:100%}
input[type=range]{accent-color:var(--cardinal)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:700;color:var(--muted);padding:7px 9px;border-bottom:2px solid var(--line2);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--ivory)} tr.sel td{background:var(--gold-bg)}
.bar{display:inline-block;height:8px;border-radius:2px;background:var(--cardinal);vertical-align:middle;margin-right:6px;opacity:.85}
.path{display:inline-flex;gap:2px}
.path i{display:inline-block;width:20px;height:18px;border-radius:2px;font-style:normal;font-size:10px;text-align:center;line-height:18px;color:#fff;font-weight:700}
.ok{color:var(--good);font-weight:700} .no{color:var(--bad);font-weight:700}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.5;padding:7px 10px;border-radius:4px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip .h{color:#D9D2C5}
.drv{display:grid;grid-template-columns:1fr 110px;gap:4px 10px;align-items:center;font-size:13px}
.drv .b{height:9px;border-radius:2px}
.banner{border-radius:6px;padding:12px 15px;margin-bottom:14px}
.banner.ok{background:var(--good-bg);color:#1B5E20} .banner.warn{background:var(--warn-bg);color:#7A4A00} .banner.info{background:var(--gold-bg);color:#5C4810}
.banner strong{display:block;font-size:15px;margin-bottom:2px}
.sim-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:10px}
.sim-grid label{font-size:11.5px;color:var(--muted);font-weight:600}
.sim-grid select{width:100%;padding:6px 4px}
@media(max-width:640px){.sim-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cmp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));margin-top:12px}
.cmp .kpi .v{font-size:22px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow .node{border:1px solid var(--line2);border-radius:6px;padding:8px 11px;background:var(--paper);font-size:12.5px}
.flow .node b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.flow .node code{font-size:12px}
.flow .arr{color:var(--gold-d);font-weight:700}
.audit{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.list li{margin-left:18px;font-size:13.5px}
.err{color:var(--bad);background:var(--bad-bg);border-radius:4px;padding:9px 12px;margin-top:10px;font-size:13.5px}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="toprow">
      <a class="home aiu-back" href="index.html">&larr; AI Academia</a>
      <a class="home aiu-back" href="forecast-lab.html">Forecast Lab</a>
      <span class="spacer"></span>
      <label class="btn" for="load-bundle" title="Review another pipeline run">Load a results bundle</label>
      <input type="file" id="load-bundle" accept=".json,application/json" class="hidden">
      <button class="btn" id="dl-bundle" type="button">Download this bundle</button>
    </div>
    <div class="eyebrow">Tools &amp; Utilities · Retail planning</div>
    <h1>Kidswear <em>Planner</em></h1>
    <p class="lede" id="lede">Forecasts you can override, size curves, markdown recommendations you can stress-test, quality gaps, a store trial and the controls that keep the models honest, built from the proof-of-concept pipeline.</p>
    <nav class="tabs" role="tablist" aria-label="Planner sections" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
